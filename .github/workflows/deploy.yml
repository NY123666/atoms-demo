# 推到 GitHub 之后自动构建并发布到 GitHub Pages。
#
# 产物是纯静态的（相对路径 + hash 路由），所以不需要任何重写规则：
# 刷新子路由不会 404，挂在 /<repo>/ 子路径下也不会白屏。
#
# 用之前只需要在仓库 Settings → Pages 里把 Source 选成 "GitHub Actions"，
# 之后每次 push 到 main 都会自动更新线上版本。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只保留一次发布，排队中的旧任务直接取消
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci

      # 与本地 `npm run verify` 同样的关卡，顺序也一样。
      - run: npm run typecheck
      - run: npm run smoke
      # 托管代理这两关是纯 Node + 回环地址（真 HTTP、真 SSE，但不碰浏览器），
      # 所以在 CI 里是**硬关卡**：代理是唯一会花钱、也唯一碰密钥的组件，
      # 它要是回归了，宁可这次不发版。
      - run: npm run smoke:hosted
      - run: npm run smoke:hosted-client

      # 部署形态决定前端能不能找到托管代理。
      # 在本仓库 Settings → Variables 里加一个 VITE_HOSTED_BASE_URL 指向代理地址
      # （例如 https://forge-hosted.vercel.app），静态站和代理不同域时就不用改代码；
      # 没配的话前端会自动试同源的 /api，代理没部署时这个选项根本不会露出来。
      #
      # VITE_STATION_API_KEY 走 Secrets 而不是 Variables：Pages 是纯静态托管，没有服务端，
      # 所以这个 Key 只能打进前端包 —— 换言之**它一定会被公开**，这是这条路的固有代价
      # （选型和风险写在 src/lib/station.ts 顶部）。用 Secrets 只是为了避免它出现在
      # 构建日志和仓库设置页里，不是因为它在那儿是安全的。
      # 介意的话就别配这一条：不配时界面上不会出现「本站内置模型」，其余功能一切照旧。
      - run: npm run build
        env:
          VITE_HOSTED_BASE_URL: ${{ vars.VITE_HOSTED_BASE_URL }}
          VITE_STATION_API_KEY: ${{ secrets.VITE_STATION_API_KEY }}
          VITE_STATION_BASE_URL: ${{ vars.VITE_STATION_BASE_URL }}
          VITE_STATION_MODEL: ${{ vars.VITE_STATION_MODEL }}

      # 后三关需要无头 Chromium（GitHub 的 ubuntu 镜像自带 Chrome）。
      # 万一镜像里没有浏览器，脚本会自己跳过并警告——这里再兜一层 continue-on-error，
      # 让"CI 环境的浏览器差异"永远不至于挡住发布这条主线。
      - run: npm run smoke:dom
        continue-on-error: true
      - run: npm run smoke:dist
        continue-on-error: true
      # 这一关会把单文件版也写进 dist，于是线上多出一个
      # /<repo>/forge-standalone.html：可以直接下载、双击打开的那一个文件。
      - run: npm run smoke:single
        continue-on-error: true

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
