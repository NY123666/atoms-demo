<!doctype html>
<html lang="zh-CN">
  <head>
    <!-- Forge 单文件版：双击即可在浏览器里打开，不需要服务器、不需要构建、不需要 API Key -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forge · 网页应用工作台</title>
    <meta
      name="description"
      content="写下需求，生成一份能直接运行的单文件网页应用：先跑通核心交互，再按你的追加描述继续迭代。每一版都会存档，可以回滚、导出源码，也可以分享成一个链接 —— 全在浏览器里完成。"
    />

    <!-- 分享卡片：链接发到微信 / 飞书 / Slack / X 时要能立起来一张像样的卡，
         否则对方只看到一串裸 URL。og:image 需要绝对地址，等线上域名定下来再补。 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Forge" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:title" content="Forge · 网页应用工作台" />
    <meta
      property="og:description"
      content="写下需求，生成一份能直接运行的单文件网页应用。每一版都会存档，可以回滚、导出源码，也可以分享成一个链接。"
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Forge · 网页应用工作台" />
    <meta
      name="twitter:description"
      content="写下需求，生成一份能直接运行的单文件网页应用。可以回滚、导出源码，也可以分享成一个链接。"
    />
    <!-- 地址栏 / 移动端浏览器 UI 跟着应用主题走，默认是深色 -->
    <meta name="theme-color" content="#100f0d" />

    <!--
      首屏底色 + 主题预热。这两段必须内联在 head 里，且必须排在样式表前面：
      样式包是外部请求，到达之前浏览器已经开始画第一帧了，不铺垫的话深色应用会先闪一下白底。
      主题值从 localStorage 直接读，所以和 src/lib/storage.ts 里的 key（forge:settings）
      及信封格式 {v,data} 是**耦合的** —— 那边改了这里不会报错，只是退化成"闪一下默认深色"，
      属于可接受的最坏结果，因此刻意不做额外同步机制。
      注意：脚本里不能出现 HTML 注释起始串（会把分词器带进退不出来的状态，
      单文件版会直接白屏），所以这里只用 // 注释。
    -->
    <style>
      html { background: #100f0d; }
      html[data-theme='light'] { background: #f6f4f1; }
    </style>
    <script>
      ;(function () {
        try {
          var raw = localStorage.getItem('forge:settings')
          if (!raw) return
          var parsed = JSON.parse(raw)
          var data = parsed && parsed.data ? parsed.data : parsed
          if (data && data.theme === 'light') {
            document.documentElement.setAttribute('data-theme', 'light')
          }
        } catch (e) {
          // 读不到、解析失败、隐私模式下抛错：都按默认深色走，不影响应用启动
        }
      })()
    </script>

    />

  var chart = document.getElementById('chart');
  chart.innerHTML = '';
  var cats = Object.keys(byCat).filter(function (c) { return byCat[c] > 0; }).sort(function (a, b) { return byCat[b] - byCat[a]; });
  if (cats.length === 0) chart.innerHTML = '<p class="muted" style="margin:0">暂无数据。</p>';
  var max = cats.length ? byCat[cats[0]] : 1;
  cats.forEach(function (c) {
    var row = document.createElement('div');
    row.style.cssText = 'display:flex;align-items:center;gap:10px;margin-bottom:8px';
    var label = document.createElement('span');
    label.textContent = c;
    label.style.cssText = 'width:90px;font-size:13px;color:var(--muted);flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap';
    var track = document.createElement('div');
    track.style.cssText = 'flex:1;height:8px;background:var(--panel2);border-radius:99px;overflow:hidden';
    var bar = document.createElement('div');

    track.appendChild(bar);
    var val = document.createElement('span');
    val.textContent = money(byCat[c]);
    val.style.cssText = 'font-size:13px;width:70px;text-align:right;flex:none';
    row.appendChild(label); row.appendChild(track); row.appendChild(val);
    chart.appendChild(row);
  });
}

document.getElementById('form').onsubmit = function (e) {
  e.preventDefault();
  var name = document.getElementById('name').value.trim();
  if (!name) return;
  items.unshift({
    id: String(Date.now()) + Math.random().toString(36).slice(2, 6),
    name: name,
    cat: document.getElementById('cat').value.trim(),
    amount: parseFloat(document.getElementById('amount').value) || 0,
    status: document.getElementById('status').value,
    at: Date.now()
  });
  document.getElementById('name').value = '';
  document.getElementById('amount').value = '';
  save(); render();
};

document.getElementById('q').oninput = function (e) {
  query = e.target.value.trim().toLowerCase();
  render();
};

var fbtns = document.querySelectorAll('[data-f]');
for (var i = 0; i < fbtns.length; i++) {
  (function (btn) {
    btn.onclick = function () {
      filter = btn.getAttribute('data-f');
      for (var j = 0; j < fbtns.length; j++) fbtns[j].className = 'ghost';
      btn.className = 'ghost on';
      render();
    };
  })(fbtns[i]);
}

document.getElementById('export').onclick = function () {
  var blob = new Blob([JSON.stringify(items, null, 2)], { type: 'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'data.json';
  a.click();
};

document.getElementById('hint').style.display = firstRun ? 'block' : 'none';
render();
